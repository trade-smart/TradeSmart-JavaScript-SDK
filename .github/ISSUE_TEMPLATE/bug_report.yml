name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste access tokens, secret keys, app keys, checksums or auth codes. Redact them.
  - type: input
    id: version
    attributes:
      label: SDK version (npm package tradesmart)
      placeholder: "2.1.1"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
      description: The SDK supports Node.js 22.19 and later.
      placeholder: "Node.js 24.11 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal TypeScript or JavaScript code sample using synthetic values.
      render: ts
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Redact any credentials first.
      render: text
