name: JavaScript CI

# The JavaScript SDK's checks. Linux (Node 22, 24 and 26), Windows and macOS run on every push and
# pull request (the repository is public: macOS minutes are free). Nothing here sets a live-test
# variable or a credential: CI runs the offline suite only.
on:
  pull_request:
    paths:
      - "sdk-javascript/**"
      - "specifications/**"
      - "docs/**"
      - "*.md" # root README, CONTRIBUTING, SECURITY, CODE_OF_CONDUCT
      - ".github/**"
  push:
    branches: [main]
    tags: ["v*"] # a release tag runs every job (path filters do not apply to tags)
    paths:
      - "sdk-javascript/**"
      - "specifications/**"
      - "docs/**"
      - "*.md" # root README, CONTRIBUTING, SECURITY, CODE_OF_CONDUCT
      - ".github/**"
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: javascript-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk-javascript

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: sdk-javascript/package-lock.json
      - run: npm ci
      - run: npm run build # the examples import the package by name, which resolves to dist/
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ["22", "24", "26"]
        include:
          - os: windows-latest
            node-version: "24"
          - os: macos-latest
            node-version: "24"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-javascript/package-lock.json
      - run: npm ci
      - run: npm run build # the examples import the package by name, which resolves to dist/
      - run: npm run test:cov

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: sdk-javascript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: javascript-package
          path: sdk-javascript/*.tgz
