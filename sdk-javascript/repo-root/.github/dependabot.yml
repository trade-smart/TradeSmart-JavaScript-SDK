version: 2
updates:
  - package-ecosystem: npm
    directory: /sdk-javascript
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"] # TypeScript 7 has no compiler API for typescript-eslint yet
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
